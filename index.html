<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1699a5">
<title>STU48 ～瀬戸内のキミと～</title>
<style>
:root{--main:#1699a5;--pink:#e8799b;--bg:#eef8f9;--ink:#17383d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 28px #0002}
.top{padding:18px 20px;padding-top:calc(18px + env(safe-area-inset-top));background:linear-gradient(135deg,#168e9c,#79c9c3);color:#fff}
.top h1{font-size:22px;margin:0}.top p{font-size:12px;margin:4px 0 0;opacity:.9}
main{padding:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.hero{height:190px;border-radius:20px;background:linear-gradient(135deg,#d8f3f3,#fff);display:flex;align-items:center;justify-content:center;font-size:76px}
.box{background:#f7fbfb;border:1px solid #d8eeee;border-radius:18px;padding:16px;margin:12px 0}
.member{display:flex;gap:12px;align-items:center}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#d7f0f1;font-size:30px;flex:none}
.member .info{flex:1}.small{font-size:12px;color:#648086}
button{border:0;border-radius:13px;padding:14px;width:100%;margin:6px 0;background:var(--main);color:white;font-weight:700}
button.light{background:#e7f3f4;color:#24636a}.choice{background:white;color:#245d64;border:2px solid #c3e2e4;text-align:left}
.choice:active,button:active{transform:scale(.99)}
.stat{display:flex;justify-content:space-between}.bar{height:9px;background:#dfebec;border-radius:99px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:var(--pink);transition:.3s}
.story{font-size:16px;line-height:1.9}.story b{font-size:17px}.log{font-size:12px;color:#647b80;line-height:1.7;white-space:pre-line}
.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#ffe8ef;color:#a94d70;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>STU48 ～瀬戸内のキミと～</h1><p>瀬戸内を舞台にした恋愛シミュレーション prototype</p></header>
<main>
<section id="title" class="screen on">
<div class="hero">🌊</div>
<div class="box"><span class="badge">WEB GAME</span><h2>瀬戸内で、君と。</h2><p>選択肢によって好感度が変化。最後にエンディングを迎えよう。</p><p class="small">公開用プロトタイプ：写真・公式素材は使用していません。</p></div>
<button onclick="goSelect()">はじめる</button>
<button class="light" onclick="load()">つづきから</button>
</section>

<section id="select" class="screen">
<h2>推しメンを選択</h2><p class="small">※公開版では、許諾を得た素材・プロフィールへ差し替えてください。</p>
<div id="memberList"></div>
<button class="light" onclick="show('title')">戻る</button>
</section>

<section id="game" class="screen">
<div class="box member">
<div class="avatar" id="icon"></div><div class="info"><b id="name"></b><div class="small" id="type"></div></div>
</div>
<div class="box">
<div class="stat"><span>💗 好感度</span><b id="score">0</b></div>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
<div class="box story" id="story"></div>
<div id="choices"></div>
<div class="box log" id="log"></div>
<button class="light" onclick="save()">💾 セーブ</button>
<button class="light" onclick="show('title')">タイトルへ</button>
</section>

<section id="end" class="screen">
<div class="hero">💌</div>
<div class="box"><h2 id="endTitle"></h2><p id="endText"></p></div>
<button onclick="restart()">もう一度遊ぶ</button>
<button class="light" onclick="show('title')">タイトルへ</button>
</section>
</main>
</div>

<script>
"use strict";

const MEMBERS=[
 {name:"メンバーA",type:"明るく元気なタイプ",icon:"🌸"},
 {name:"メンバーB",type:"クールで大人っぽいタイプ",icon:"🌙"},
 {name:"メンバーC",type:"ふんわり癒やし系",icon:"🍀"}
];

const CHAPTERS=[
 {time:"放課後",text:"瀬戸内の海が見える駅で、彼女と二人きりになった。\\n「今日はどこ行く？」と彼女が笑う。",choices:[
  ["海沿いを歩く",4,"「海、見ながら歩こうよ」\\n彼女は嬉しそうに頷いた。"],
  ["カフェで話す",3,"「ゆっくり話せるところがいいね」\\n二人で駅前のカフェへ向かった。"],
  ["行き先を任せる",2,"「じゃあ、私についてきて！」\\n彼女が先に歩き出した。"]
 ]},
 {time:"夕方",text:"夕暮れの海を眺めながら、彼女が少し真剣な顔になった。\\n「実は、ちょっと相談したいことがあるんだ」",choices:[
  ["ちゃんと話を聞く",4,"「うん。何でも話して」\\n彼女は安心したように笑った。"],
  ["元気づける",3,"「大丈夫。きっと何とかなるよ」\\n彼女の表情が少し明るくなった。"],
  ["冗談で笑わせる",2,"「じゃあ、まず笑ってもらおうかな」\\n彼女は吹き出した。"]
 ]},
 {time:"帰り道",text:"駅へ向かう途中、彼女が足を止めてこちらを見る。\\n「今日は……楽しかった？」",choices:[
  ["すごく楽しかった",5,"「君と一緒だったからね」\\n彼女は少し照れた。"],
  ["また一緒に行こう",4,"「もちろん！」\\n次の予定が自然に決まっていった。"],
  ["恥ずかしくて黙る",1,"「……ふふ」\\n彼女は何かを察したように笑った。"]
 ]}
];

let state={member:0,score:0,chapter:0,log:[]};

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
function goSelect(){renderMembers();show("select")}
function renderMembers(){
 $("memberList").innerHTML=MEMBERS.map((m,i)=>`
 <div class="box member"><div class="avatar">${m.icon}</div><div class="info"><b>${m.name}</b><div class="small">${m.type}</div></div>
 <button style="width:auto;margin:0" onclick="start(${i})">選ぶ</button></div>`).join("");
}
function start(i){state={member:i,score:0,chapter:0,log:[]};show("game");render()}
function restart(){start(state.member)}
function render(){
 const m=MEMBERS[state.member],c=CHAPTERS[state.chapter];
 $("icon").textContent=m.icon;$("name").textContent=m.name;$("type").textContent=m.type;
 $("score").textContent=state.score;$("fill").style.width=Math.min(100,state.score/17*100)+"%";
 $("story").innerHTML="<b>"+c.time+"</b><p>"+c.text.replace(/\\n/g,"<br>")+"</p>";
 $("choices").innerHTML=c.choices.map((x,i)=>`<button class="choice" onclick="pick(${i})">💬 ${x[0]}</button>`).join("");
 $("log").textContent=state.log.length?state.log.join("\\n"):"まだ選択していません。";
}
function pick(i){
 const c=CHAPTERS[state.chapter].choices[i];
 state.score+=c[1];state.log.push("「"+c[0]+"」 → 好感度 +"+c[1]);
 state.chapter++;
 if(state.chapter>=CHAPTERS.length){end();return}
 render();saveSilent();
}
function end(){
 const high=state.score>=12;
 show("end");
 $("endTitle").textContent=high?"💕 特別な一日 END":"🌅 また会おう END";
 $("endText").textContent=high
 ?"今日という一日を境に、二人の距離は少しだけ近づいた。瀬戸内の夕日が、二人を優しく照らしていた。"
 :"楽しい時間はあっという間に過ぎた。また会える日を、二人で約束した。";
 localStorage.removeItem("stu48koi");
}
function saveSilent(){try{localStorage.setItem("stu48koi",JSON.stringify(state))}catch(e){}}
function save(){saveSilent();alert("セーブしました！")}
function load(){
 try{
  const x=localStorage.getItem("stu48koi");
  if(!x){alert("セーブデータがありません");return}
  state=JSON.parse(x);show("game");render();
 }catch(e){alert("セーブデータを読み込めませんでした")}
}
window.addEventListener("error",e=>console.error(e));
renderMembers();
</script>
</body>
</html>
